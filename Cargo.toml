[package]
name = "autocoding-gui"
version = "0.4.4"
edition = "2021"
default-run = "autocoding-gui"

[features]
default = []
input-automation = ["dep:enigo"]

[dependencies]
eframe = "0.29"
egui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tokio = { version = "1.42", features = ["rt-multi-thread", "macros", "time"] }
crossbeam-channel = "0.5"
anyhow = "1.0"
thiserror = "1.0"
time = { version = "0.3", features = ["formatting"] }
regex = "1.10"
walkdir = "2.5"
wait-timeout = "0.2"
actix-web = { version = "4", features = ["macros"] }
clap = { version = "4.3", features = ["derive"] }
enigo = { version = "0.1.1", optional = true }
async-stream = "0.3"

[[bin]]
name = "input_cli"
path = "src/bin/input_cli.rs"
required-features = ["input-automation"]
