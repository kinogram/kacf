<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title></title>
    <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="shell">
    <header class="topbar" id="topbar">
        <div class="topbar-brand" id="topbar_brand" aria-label=""></div>
        <div class="topbar-status" role="status" aria-live="polite">
            <div class="runbar" id="runbar" data-state="idle"><div class="runbar-fill"></div></div>
            <div class="hint" id="topbar_line_text"></div>
        </div>
        <button class="btn-ghost btn-icon-only" id="back_to_main_btn"></button>
    </header>
    <main class="diff-main">
        <article class="diff-article">
            <h1 class="diff-h1" id="diff_title"></h1>
            <p class="diff-sub" id="diff_sub"></p>
            <div id="diff_view" class="diff-view"></div>
        </article>
    </main>
</div>

<script src="/assets/diff.js"></script>
</body>
</html>
