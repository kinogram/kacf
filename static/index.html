<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>KACF - Kinogram AutoCoding Framework</title>
    <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div class="shell">
    <header class="topbar" id="topbar">
        <!-- Sidebar toggle: desktop collapses/expands; mobile opens/closes the overlay sidebar. -->
        <button class="btn-ghost btn-icon-only" id="sidebar_toggle_btn">|||</button>
        <div class="topbar-brand" id="topbar_brand" aria-label=""></div>
        <div class="topbar-status" role="status" aria-live="polite">
            <div class="runbar" id="runbar" data-state="idle"><div class="runbar-fill"></div></div>
            <div class="hint" id="topbar_line_text"></div>
        </div>
        <!-- Global settings: gear icon only; accessible label is set via language pack at runtime. -->
        <button class="btn-ghost btn-icon-only" id="open_global_config_btn">⚙</button>
        <!-- Admin panel shortcut: visible only for admin users. -->
        <button class="btn-ghost btn-icon-only" id="open_admin_btn" style="display:none;"></button>
        <!-- Account menu: icon-only; label is set via language pack at runtime. -->
        <button class="btn-ghost btn-icon-only" id="open_account_btn"></button>
    </header>
    <div class="account-menu" id="account_menu" style="display:none;">
        <div class="account-menu-title" id="account_menu_title"></div>
        <div class="account-menu-body" id="account_menu_body"></div>
        <div class="buttons account-menu-row">
            <button class="btn-ghost" id="account_manage_btn"></button>
            <button class="btn-ghost" id="account_admin_panel_btn" style="display:none;"></button>
        </div>
        <div class="buttons account-menu-row">
            <button class="btn-ghost" id="account_switch_btn"></button>
            <button class="btn-ghost" id="account_logout_btn"></button>
            <button class="btn-ghost" id="account_exit_guest_btn" style="display:none;"></button>
        </div>
        <div class="buttons account-menu-row">
            <button class="btn-ghost" id="account_github_btn"></button>
            <button class="btn-ghost" id="account_devhome_btn"></button>
        </div>
        <div class="buttons account-menu-row">
            <button class="btn-ghost" id="account_donate_btn"></button>
            <button class="btn-ghost" id="account_thanks_btn"></button>
        </div>
    </div>
    <div class="sidebar-overlay" id="sidebar_overlay"></div>
    <div class="app-shell">
        <aside class="sidebar" id="project_sidebar">
            <div class="sidebar-header">
                <div class="sidebar-brand" id="sidebar_brand"></div>
            </div>
            <div class="sidebar-content">
                <div>
                    <label for="unattended_mode" id="label_unattended_mode"></label>
                    <input id="unattended_mode" type="checkbox">
                </div>
                <h2 class="title" id="section_projects_title"></h2>
                <p class="sub" id="section_projects_sub"></p>
                <div>
                    <label for="project_name" id="label_project_name"></label>
                    <input id="project_name" type="text" placeholder="">
                </div>
                <div class="buttons">
                    <button class="btn-ghost" id="project_new_btn"></button>
                    <button class="btn-ghost" id="project_save_btn"></button>
                    <button class="btn-ghost" id="project_load_btn"></button>
                    <button class="btn-ghost" id="project_delete_btn"></button>
                </div>
                <div class="buttons">
                </div>
                <div class="hint" id="project_dirty_state"></div>
                <input id="workspace" type="hidden" value="">
                <select id="project_selector" style="display:none;"></select>
                <div class="project-tools">
                    <input id="project_search" type="text" placeholder="">
                    <div class="project-summary" id="project_summary_text"></div>
                </div>
                <div id="project_accordion" class="project-list"></div>
            </div>
        </aside>
        <main class="main-column">
            <section class="hero">
                <h1>KACF - Kinogram AutoCoding Framework</h1>
                <p id="hero_sub"></p>
                <div class="banner" id="resume_banner"></div>
                <div class="banner" id="backend_offline_banner" style="display:none;background:#ffe9e7;border-color:#ffb8b2;color:#8a1f17;"></div>
            </section>

            <div class="grid">
                <section class="card">
	            <h2 class="title" id="section_config_title"></h2>
	            <p class="sub" id="section_config_sub"></p>
	
	            <div>
	                <label for="goal" id="label_goal"></label>
	                <textarea id="goal" placeholder=""></textarea>
	            </div>
	
	            <hr style="border:none;border-top:1px solid var(--line);margin:14px 0;">

            <h3 class="title" style="font-size:16px;" id="section_git_title"></h3>
            <div class="row three">
                <div>
                    <label for="remote" id="label_remote"></label>
                    <input id="remote" type="text" value="origin">
                </div>
                <div>
                    <label for="remote_url" id="label_remote_url"></label>
                    <input id="remote_url" type="text" placeholder="https://token@github.com/user/repo.git">
                </div>
                <div>
                    <label for="branch" id="label_branch"></label>
                    <input id="branch" type="text" value="main">
                </div>
            </div>
            <div class="row two">
                <div>
                    <label for="git_user_name" id="label_git_user_name"></label>
                    <input id="git_user_name" type="text" placeholder="">
                </div>
                <div>
                    <label for="git_user_email" id="label_git_user_email"></label>
                    <input id="git_user_email" type="text" placeholder="">
                </div>
            </div>

            <div class="buttons">
                <button id="start_btn"></button>
                <button class="btn-warn" id="resume_btn"></button>
                <button class="btn-danger" id="stop_btn"></button>
                <button class="btn-ghost" id="go_running_project_btn"></button>
                <button class="btn-ghost" id="revert_btn"></button>
                <button class="btn-ghost" id="push_btn"></button>
            </div>
            <p class="hint" id="hint_run_new_round"></p>
                </section>

                <section class="card">
            <h2 class="title" id="section_status_title"></h2>
            <div class="status-box" id="status"></div>
            <div class="hint" id="readonly_mode_text"></div>
            <div class="hint" id="auto_save_state"></div>
            <div class="hint" id="diagnostics"></div>
            <div class="hint" id="metrics_text"></div>
            <div class="hint" id="digest_dist_text"></div>
            <div class="hint" id="root_top_text"></div>
            <div class="readiness idle" id="readiness_chip"></div>

            <h2 class="title" style="margin-top:14px;" id="section_clarify_title"></h2>
            <form id="clarify_form"></form>
            <div class="buttons">
                <button id="clarify_submit_btn"></button>
            </div>
                </section>
            </div>

            <section class="card" style="margin-top:14px;" id="vm_card">
                <h2 class="title" id="section_vm_title"></h2>
                <p class="sub" id="section_vm_sub"></p>
                <div class="row three">
                    <div>
                        <label for="vm_name" id="label_vm_name"></label>
                        <input id="vm_name" type="text" placeholder="">
                    </div>
                    <div>
                        <label for="vm_backend" id="label_vm_backend"></label>
                        <select id="vm_backend">
                            <option value="metadata-only">metadata-only</option>
                            <option value="qemu">qemu</option>
                            <option value="libvirt">libvirt</option>
                        </select>
                    </div>
                    <div>
                        <label for="vm_os_image" id="label_vm_os_image"></label>
                        <input id="vm_os_image" type="text" placeholder="">
                    </div>
                    <div>
                        <label for="vm_ssh_user" id="label_vm_ssh_user"></label>
                        <input id="vm_ssh_user" type="text" value="root">
                    </div>
                </div>
                <div class="row three">
                    <div>
                        <label for="vm_cpu" id="label_vm_cpu"></label>
                        <input id="vm_cpu" type="text" value="2">
                    </div>
                    <div>
                        <label for="vm_memory_mb" id="label_vm_memory_mb"></label>
                        <input id="vm_memory_mb" type="text" value="4096">
                    </div>
                    <div>
                        <label for="vm_disk_gb" id="label_vm_disk_gb"></label>
                        <input id="vm_disk_gb" type="text" value="40">
                    </div>
                </div>
                <div class="buttons">
                    <button id="vm_provision_btn"></button>
                    <button class="btn-ghost" id="vm_refresh_btn"></button>
                    <button class="btn-ghost" id="vm_ready_btn"></button>
                    <button class="btn-ghost" id="vm_bootstrap_btn"></button>
                </div>
                <div class="row two" style="margin-top:10px;">
                    <div>
                        <label for="vm_target_select" id="label_vm_target_select"></label>
                        <select id="vm_target_select"></select>
                    </div>
                    <div>
                        <div class="checkbox-row">
                            <input id="vm_purge_disk" type="checkbox">
                            <label for="vm_purge_disk" id="label_vm_purge_disk"></label>
                        </div>
                    </div>
                </div>
                <div class="buttons">
                    <button class="btn-ghost" id="vm_start_btn"></button>
                    <button class="btn-ghost" id="vm_stop_btn"></button>
                    <button class="btn-danger" id="vm_delete_btn"></button>
                </div>
                <div class="buttons">
                    <button class="btn-ghost" id="vm_refresh_logs_btn"></button>
                </div>
                <div class="row two" style="margin-top:10px;">
                    <div>
                        <label for="vm_snapshot_name" id="label_vm_snapshot_name"></label>
                        <input id="vm_snapshot_name" type="text" placeholder="">
                    </div>
                    <div class="buttons" style="align-items:flex-end;">
                        <button class="btn-ghost" id="vm_snapshot_refresh_btn"></button>
                        <button class="btn-ghost" id="vm_snapshot_create_btn"></button>
                        <button class="btn-ghost" id="vm_snapshot_apply_btn"></button>
                        <button class="btn-danger" id="vm_snapshot_delete_btn"></button>
                    </div>
                </div>
                <div class="row two" style="margin-top:10px;">
                    <div>
                        <label for="vm_clone_new_name" id="label_vm_clone_new_name"></label>
                        <input id="vm_clone_new_name" type="text" placeholder="">
                    </div>
                    <div class="buttons" style="align-items:flex-end;">
                        <button class="btn-ghost" id="vm_clone_btn"></button>
                    </div>
                </div>
                <div class="hint" id="vm_capabilities"></div>
                <div class="hint" id="vm_status_text"></div>
                <pre id="vm_list" style="max-height:240px;overflow:auto;"></pre>
                <pre id="vm_snapshots" style="max-height:140px;overflow:auto;"></pre>
                <div class="row two" style="margin-top:10px;">
                    <div>
                        <label for="vm_exec_command" id="label_vm_exec_command"></label>
                        <input id="vm_exec_command" type="text" placeholder="">
                    </div>
                    <div class="buttons" style="align-items:flex-end;">
                        <button class="btn-ghost" id="vm_exec_btn"></button>
                        <button class="btn-danger" id="vm_exec_cancel_btn"></button>
                    </div>
                </div>
                <div class="row two" style="margin-top:10px;">
                    <div>
                        <label for="vm_exec_timeout_sec" id="label_vm_exec_timeout_sec"></label>
                        <input id="vm_exec_timeout_sec" type="text" value="60">
                    </div>
                    <div>
                        <label for="vm_exec_wait_ready_sec" id="label_vm_exec_wait_ready_sec"></label>
                        <input id="vm_exec_wait_ready_sec" type="text" value="0">
                    </div>
                </div>
                <div class="row two" style="margin-top:10px;">
                    <div>
                        <label for="vm_exec_priority" id="label_vm_exec_priority"></label>
                        <input id="vm_exec_priority" type="text" value="0">
                    </div>
                    <div>
                        <label for="vm_exec_retry_max" id="label_vm_exec_retry_max"></label>
                        <input id="vm_exec_retry_max" type="text" value="0">
                    </div>
                </div>
                <div class="buttons">
                    <button class="btn-ghost" id="vm_exec_enqueue_btn"></button>
                    <button class="btn-ghost" id="vm_exec_batch_enqueue_btn"></button>
                    <button class="btn-ghost" id="vm_exec_profile_enqueue_btn"></button>
                    <button class="btn-ghost" id="vm_exec_run_next_btn"></button>
                    <button class="btn-ghost" id="vm_exec_queue_refresh_btn"></button>
                </div>
                <div style="margin-top:10px;">
                    <label for="vm_exec_profile" id="label_vm_exec_profile"></label>
                    <select id="vm_exec_profile"></select>
                </div>
                <div class="row two" style="margin-top:10px;">
                    <div>
                        <label for="vm_exec_profile_workdir" id="label_vm_exec_profile_workdir"></label>
                        <input id="vm_exec_profile_workdir" type="text" placeholder="">
                    </div>
                    <div>
                        <label for="vm_exec_profile_test_cmd" id="label_vm_exec_profile_test_cmd"></label>
                        <input id="vm_exec_profile_test_cmd" type="text" placeholder="">
                    </div>
                </div>
                <div class="buttons" style="margin-top:8px;">
                    <button class="btn-ghost" id="vm_exec_profile_preview_btn"></button>
                </div>
                <pre id="vm_exec_profile_preview" style="max-height:120px;overflow:auto;"></pre>
                <div class="row two" style="margin-top:10px;">
                    <div>
                        <label for="vm_exec_custom_profile_name" id="label_vm_exec_custom_profile_name"></label>
                        <input id="vm_exec_custom_profile_name" type="text" placeholder="">
                    </div>
                    <div class="buttons" style="align-items:flex-end;">
                        <button class="btn-ghost" id="vm_exec_custom_profile_load_btn"></button>
                        <button class="btn-ghost" id="vm_exec_custom_profile_save_btn"></button>
                        <button class="btn-danger" id="vm_exec_custom_profile_delete_btn"></button>
                    </div>
                </div>
                <div style="margin-top:10px;">
                    <label for="vm_exec_custom_profile_commands" id="label_vm_exec_custom_profile_commands"></label>
                    <textarea id="vm_exec_custom_profile_commands" rows="4" placeholder=""></textarea>
                </div>
                <div class="row two" style="margin-top:10px;">
                    <div>
                        <label for="vm_self_debug_cycles" id="label_vm_self_debug_cycles"></label>
                        <input id="vm_self_debug_cycles" type="text" value="3">
                    </div>
                    <div>
                        <label for="vm_self_debug_fix_cmd" id="label_vm_self_debug_fix_cmd"></label>
                        <input id="vm_self_debug_fix_cmd" type="text" placeholder="">
                    </div>
                </div>
                <div style="margin-top:10px;">
                    <label for="vm_self_debug_verify_cmd" id="label_vm_self_debug_verify_cmd"></label>
                    <input id="vm_self_debug_verify_cmd" type="text" placeholder="">
                </div>
                <div class="row two" style="margin-top:10px;">
                    <div>
                        <label for="vm_self_debug_success_streak_target" id="label_vm_self_debug_success_streak_target"></label>
                        <input id="vm_self_debug_success_streak_target" type="text" value="2">
                    </div>
                    <div>
                        <label for="vm_self_debug_fail_streak_target" id="label_vm_self_debug_fail_streak_target"></label>
                        <input id="vm_self_debug_fail_streak_target" type="text" value="3">
                    </div>
                </div>
                <div class="buttons" style="margin-top:8px;">
                    <button class="btn-ghost" id="vm_self_debug_preview_btn"></button>
                    <button class="btn-ghost" id="vm_self_debug_start_btn"></button>
                    <button class="btn-ghost" id="vm_self_debug_runs_refresh_btn"></button>
                    <button class="btn-danger" id="vm_self_debug_stop_btn"></button>
                </div>
                <div style="margin-top:10px;">
                    <label for="vm_self_debug_run_id" id="label_vm_self_debug_run_id"></label>
                    <input id="vm_self_debug_run_id" type="text" placeholder="">
                </div>
                <pre id="vm_self_debug_plan" style="max-height:140px;overflow:auto;"></pre>
                <pre id="vm_self_debug_runs" style="max-height:120px;overflow:auto;"></pre>
                <div style="margin-top:10px;">
                    <label for="vm_exec_batch_commands" id="label_vm_exec_batch_commands"></label>
                    <textarea id="vm_exec_batch_commands" rows="4" placeholder=""></textarea>
                </div>
                <div class="row two" style="margin-top:10px;">
                    <div>
                        <label for="vm_exec_cancel_task_id" id="label_vm_exec_cancel_task_id"></label>
                        <input id="vm_exec_cancel_task_id" type="text" placeholder="">
                    </div>
                    <div class="buttons" style="align-items:flex-end;">
                        <button class="btn-danger" id="vm_exec_queue_cancel_btn"></button>
                    </div>
                </div>
                <pre id="vm_exec_output" style="max-height:200px;overflow:auto;"></pre>
                <div class="hint" id="vm_exec_queue_stats"></div>
                <pre id="vm_exec_queue" style="max-height:200px;overflow:auto;"></pre>
                <pre id="vm_logs" style="max-height:220px;overflow:auto;"></pre>
            </section>

            <section class="card log-panel" style="margin-top:14px;">
        <h2 class="title" id="section_log_title"></h2>
        <pre id="log"></pre>
        <div class="buttons log-toolbar">
            <button class="btn-ghost" id="clear_log_btn"></button>
            <button class="btn-ghost" id="export_log_btn"></button>
            <button class="btn-ghost" id="export_snapshot_btn"></button>
            <button class="btn-ghost" id="export_report_btn"></button>
            <button class="btn-ghost" id="view_diff_btn"></button>
        </div>
        <div class="hint" id="hint_log_exports"></div>
            </section>
        </main>
    </div>
</div>
<div class="modal-mask" id="global_config_modal">
    <div class="modal-card">
        <h3 class="title" id="section_global_title"></h3>
        <div class="row two">
            <div>
                <label for="api_key" id="label_api_key"></label>
                <input id="api_key" type="text" placeholder="">
            </div>
            <div>
                <label for="model" id="label_model"></label>
                <select id="model">
                    <option value="deepseek-reasoner">deepseek-reasoner</option>
                    <option value="deepseek-chat">deepseek-chat</option>
                </select>
            </div>
        </div>
        <div>
            <label for="base_url" id="label_base_url"></label>
            <input id="base_url" type="text" value="https://api.deepseek.com">
        </div>
        <div>
            <label for="language_select" id="label_language"></label>
            <select id="language_select"></select>
        </div>
        <div class="row two">
            <div>
                <label for="global_auto_resume_attempts" id="label_global_auto_resume_attempts"></label>
                <input id="global_auto_resume_attempts" type="text" placeholder="">
            </div>
            <div>
                <label for="global_stop_after_minutes" id="label_global_stop_after_minutes"></label>
                <input id="global_stop_after_minutes" type="text" placeholder="">
            </div>
        </div>
        <div class="row two">
            <div>
                <label for="global_history_max_messages" id="label_history_max_messages"></label>
                <input id="global_history_max_messages" type="text" placeholder="">
            </div>
            <div>
                <label for="global_history_max_chars" id="label_history_max_chars"></label>
                <input id="global_history_max_chars" type="text" placeholder="">
            </div>
        </div>
        <div class="row two">
            <div>
                <label for="global_log_max_chars" id="label_global_log_max_chars"></label>
                <input id="global_log_max_chars" type="text" placeholder="">
            </div>
            <div></div>
        </div>
        <div class="buttons">
            <button id="save_global_config_btn"></button>
            <button class="btn-ghost" id="close_global_config_btn"></button>
        </div>
    </div>
</div>

<script src="/assets/app.js"></script>
</body>
</html>
